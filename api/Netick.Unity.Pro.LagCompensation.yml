- uid: Netick.Unity.Pro.LagCompensation.Compensate
  commentId: F:Netick.Unity.Pro.LagCompensation.Compensate
  id: Compensate
  parent: Netick.Unity.Pro.LagCompensation
  langs:
  - csharp
  - vb
  name: Compensate
  nameWithType: LagCompensation.Compensate
  fullName: Netick.Unity.Pro.LagCompensation.Compensate
  type: Field
  assemblies:
  - Netick.Unity.Pro
  namespace: Netick.Unity.Pro
  summary: >-
    Master switch for server-side rewind. When false, queries resolve against the latest

    interpolated world for every input source instead of rewinding to each one's perceived

    tick. HitShape capture and the snapshot ring keep running either way.
  example: []
  syntax:
    content: public bool Compensate
    return:
      type: System.Boolean
