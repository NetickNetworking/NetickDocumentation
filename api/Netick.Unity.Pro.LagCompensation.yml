- uid: Netick.Unity.Pro.LagCompensation.Raycast(UnityEngine.Vector3,UnityEngine.Vector3,Netick.Unity.Pro.NetHit@,Netick.NetworkPlayer,System.Single,System.Int32,System.Boolean,System.Predicate{Netick.Unity.Pro.HitShapeContainer})
  commentId: M:Netick.Unity.Pro.LagCompensation.Raycast(UnityEngine.Vector3,UnityEngine.Vector3,Netick.Unity.Pro.NetHit@,Netick.NetworkPlayer,System.Single,System.Int32,System.Boolean,System.Predicate{Netick.Unity.Pro.HitShapeContainer})
  id: Raycast(UnityEngine.Vector3,UnityEngine.Vector3,Netick.Unity.Pro.NetHit@,Netick.NetworkPlayer,System.Single,System.Int32,System.Boolean,System.Predicate{Netick.Unity.Pro.HitShapeContainer})
  parent: Netick.Unity.Pro.LagCompensation
  langs:
  - csharp
  - vb
  name: Raycast(Vector3, Vector3, out NetHit, NetworkPlayer, float, int, bool, Predicate<HitShapeContainer>)
  nameWithType: LagCompensation.Raycast(Vector3, Vector3, out NetHit, NetworkPlayer, float, int, bool, Predicate<HitShapeContainer>)
  fullName: Netick.Unity.Pro.LagCompensation.Raycast(UnityEngine.Vector3, UnityEngine.Vector3, out Netick.Unity.Pro.NetHit, Netick.NetworkPlayer, float, int, bool, System.Predicate<Netick.Unity.Pro.HitShapeContainer>)
  type: Method
  assemblies:
  - Netick.Unity.Pro
  namespace: Netick.Unity.Pro
  summary: >-
    Casts a lag-compensated ray against every <xref href="Netick.Unity.Pro.HitShape" data-throw-if-not-resolved="false"></xref> in the scene and

    returns the closest hit. The world is rewound to the snapshot pair the

    <code class="paramref">inputSource</code> was interpolating when the input was produced, so the

    hit matches what that player saw on screen.
  example: []
  syntax:
    content: public bool Raycast(Vector3 origin, Vector3 direction, out NetHit hitData, NetworkPlayer inputSource, float maxDistance = Infinity, int layerMask = -1, bool includeInputSource = false, Predicate<HitShapeContainer> filter = null)
    parameters:
    - id: origin
      type: UnityEngine.Vector3
      description: Ray start, in world space.
    - id: direction
      type: UnityEngine.Vector3
      description: Ray direction. Need not be normalized.
    - id: hitData
      type: Netick.Unity.Pro.NetHit
      description: The closest hit, when the method returns true.
    - id: inputSource
      type: Netick.NetworkPlayer
      description: The player to rewind for — pass the shooting player's input source. Null (or a non-server caller) resolves against the latest interpolated world.
    - id: maxDistance
      type: System.Single
      description: Maximum ray length.
    - id: layerMask
      type: System.Int32
      description: Layer mask selecting which HitShape layers to test.
    - id: includeInputSource
      type: System.Boolean
      description: When false, the input source's own HitShapes are skipped.
    - id: filter
      type: System.Predicate{Netick.Unity.Pro.HitShapeContainer}
      description: Optional predicate to reject candidate containers before testing.
    return:
      type: System.Boolean
      description: True if a HitShape was hit.
    content.vb: Public Function Raycast(origin As Vector3, direction As Vector3, hitData As NetHit, inputSource As NetworkPlayer, maxDistance As Single = Infinity, layerMask As Integer = -1, includeInputSource As Boolean = False, filter As Predicate(Of HitShapeContainer) = Nothing) As Boolean
  overload: Netick.Unity.Pro.LagCompensation.Raycast*
  nameWithType.vb: LagCompensation.Raycast(Vector3, Vector3, NetHit, NetworkPlayer, Single, Integer, Boolean, Predicate(Of HitShapeContainer))
  fullName.vb: Netick.Unity.Pro.LagCompensation.Raycast(UnityEngine.Vector3, UnityEngine.Vector3, Netick.Unity.Pro.NetHit, Netick.NetworkPlayer, Single, Integer, Boolean, System.Predicate(Of Netick.Unity.Pro.HitShapeContainer))
  name.vb: Raycast(Vector3, Vector3, NetHit, NetworkPlayer, Single, Integer, Boolean, Predicate(Of HitShapeContainer))
- uid: Netick.Unity.Pro.LagCompensation.Raycast(Netick.Unity.Pro.HitShape,UnityEngine.Vector3,UnityEngine.Vector3,Netick.Unity.Pro.NetHit@,Netick.NetworkPlayer,System.Single,System.Boolean)
  commentId: M:Netick.Unity.Pro.LagCompensation.Raycast(Netick.Unity.Pro.HitShape,UnityEngine.Vector3,UnityEngine.Vector3,Netick.Unity.Pro.NetHit@,Netick.NetworkPlayer,System.Single,System.Boolean)
  id: Raycast(Netick.Unity.Pro.HitShape,UnityEngine.Vector3,UnityEngine.Vector3,Netick.Unity.Pro.NetHit@,Netick.NetworkPlayer,System.Single,System.Boolean)
  parent: Netick.Unity.Pro.LagCompensation
  langs:
  - csharp
  - vb
  name: Raycast(HitShape, Vector3, Vector3, out NetHit, NetworkPlayer, float, bool)
  nameWithType: LagCompensation.Raycast(HitShape, Vector3, Vector3, out NetHit, NetworkPlayer, float, bool)
  fullName: Netick.Unity.Pro.LagCompensation.Raycast(Netick.Unity.Pro.HitShape, UnityEngine.Vector3, UnityEngine.Vector3, out Netick.Unity.Pro.NetHit, Netick.NetworkPlayer, float, bool)
  type: Method
  assemblies:
  - Netick.Unity.Pro
  namespace: Netick.Unity.Pro
  summary: >-
    Casts a lag-compensated ray against a single, specific <xref href="Netick.Unity.Pro.HitShape" data-throw-if-not-resolved="false"></xref> and

    returns whether it was hit. Skips the broadphase entirely — use this when you

    already know which shape you want to test (e.g. a re-validation pass).
  example: []
  syntax:
    content: public bool Raycast(HitShape shape, Vector3 origin, Vector3 direction, out NetHit hitData, NetworkPlayer inputSource, float maxDistance = Infinity, bool includeInputSource = false)
    parameters:
    - id: shape
      type: Netick.Unity.Pro.HitShape
      description: The HitShape to test. Must belong to a live container.
    - id: origin
      type: UnityEngine.Vector3
      description: Ray start, in world space.
    - id: direction
      type: UnityEngine.Vector3
      description: Ray direction. Need not be normalized.
    - id: hitData
      type: Netick.Unity.Pro.NetHit
      description: The hit, when the method returns true.
    - id: inputSource
      type: Netick.NetworkPlayer
      description: The player to rewind for. See the scene-wide overload.
    - id: maxDistance
      type: System.Single
      description: Maximum ray length.
    - id: includeInputSource
      type: System.Boolean
      description: When false, returns false if the shape belongs to the input source.
    return:
      type: System.Boolean
      description: True if the shape was hit.
    content.vb: Public Function Raycast(shape As HitShape, origin As Vector3, direction As Vector3, hitData As NetHit, inputSource As NetworkPlayer, maxDistance As Single = Infinity, includeInputSource As Boolean = False) As Boolean
  overload: Netick.Unity.Pro.LagCompensation.Raycast*
  nameWithType.vb: LagCompensation.Raycast(HitShape, Vector3, Vector3, NetHit, NetworkPlayer, Single, Boolean)
  fullName.vb: Netick.Unity.Pro.LagCompensation.Raycast(Netick.Unity.Pro.HitShape, UnityEngine.Vector3, UnityEngine.Vector3, Netick.Unity.Pro.NetHit, Netick.NetworkPlayer, Single, Boolean)
  name.vb: Raycast(HitShape, Vector3, Vector3, NetHit, NetworkPlayer, Single, Boolean)
