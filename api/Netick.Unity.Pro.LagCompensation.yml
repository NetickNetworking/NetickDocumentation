  type: Method
  assemblies:
  - Netick.Unity.Pro
  namespace: Netick.Unity.Pro
  summary: >-
    Casts a lag-compensated ray against every <xref href="Netick.Unity.Pro.HitShape" data-throw-if-not-resolved="false"></xref> in the scene and

    collects all hits into <code class="paramref">hits</code> (cleared first). Same rewind behavior

    as <xref href="Netick.Unity.Pro.LagCompensation.Raycast(UnityEngine.Vector3%2cUnityEngine.Vector3%2cNetick.Unity.Pro.NetHit%40%2cNetick.NetworkPlayer%2cSystem.Single%2cSystem.Int32%2cSystem.Boolean%2cSystem.Predicate%7bNetick.Unity.Pro.HitShapeContainer%7d)" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public void RaycastAll(Vector3 origin, Vector3 direction, List<NetHit> hits, NetworkPlayer inputSource, float maxDistance = Infinity, int layerMask = -1, bool includeInputSource = false, bool oneHitPerHitShapeContainer = false, Predicate<HitShapeContainer> filter = null)
    parameters:
    - id: origin
      type: UnityEngine.Vector3
      description: Ray start, in world space.
    - id: direction
      type: UnityEngine.Vector3
      description: Ray direction. Need not be normalized.
    - id: hits
      type: System.Collections.Generic.List{Netick.Unity.Pro.NetHit}
      description: Destination list. Cleared, then filled with every hit (unordered).
    - id: inputSource
      type: Netick.NetworkPlayer
      description: The player to rewind for.
    - id: maxDistance
      type: System.Single
      description: Maximum ray length.
    - id: layerMask
      type: System.Int32
      description: Layer mask selecting which HitShape layers to test.
    - id: includeInputSource
      type: System.Boolean
      description: When false, the input source's own HitShapes are skipped.
    - id: oneHitPerHitShapeContainer
      type: System.Boolean
      description: When true, at most one hit is reported per container.
    - id: filter
      type: System.Predicate{Netick.Unity.Pro.HitShapeContainer}
      description: Optional predicate to reject candidate containers before testing.
    content.vb: Public Sub RaycastAll(origin As Vector3, direction As Vector3, hits As List(Of NetHit), inputSource As NetworkPlayer, maxDistance As Single = Infinity, layerMask As Integer = -1, includeInputSource As Boolean = False, oneHitPerHitShapeContainer As Boolean = False, filter As Predicate(Of HitShapeContainer) = Nothing)
