- uid: Netick.Unity.Pro.HitShapeContainer.AddHitShape(Netick.Unity.Pro.HitShape)
  commentId: M:Netick.Unity.Pro.HitShapeContainer.AddHitShape(Netick.Unity.Pro.HitShape)
  id: AddHitShape(Netick.Unity.Pro.HitShape)
  parent: Netick.Unity.Pro.HitShapeContainer
