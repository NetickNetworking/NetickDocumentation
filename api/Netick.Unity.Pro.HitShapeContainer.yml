  name: AddHitShape(HitShape)
  nameWithType: HitShapeContainer.AddHitShape(HitShape)
  fullName: Netick.Unity.Pro.HitShapeContainer.AddHitShape(Netick.Unity.Pro.HitShape)
  type: Method
  assemblies:
  - Netick.Unity.Pro
  namespace: Netick.Unity.Pro
  summary: >-
    Adds a <xref href="Netick.Unity.Pro.HitShape" data-throw-if-not-resolved="false"></xref> to this container at runtime.

    LOCAL call only - this change is NOT synced over the network. For server/client

    hit detection to agree, you MUST call this on BOTH the server and the client at

    the same logical moment (e.g. driven by a synced network property, RPC, etc). Calling on only one side will cause server/client

    hit divergence.
  example: []
  syntax:
    content: public void AddHitShape(HitShape shape)
    parameters:
    - id: shape
      type: Netick.Unity.Pro.HitShape
    content.vb: Public Sub AddHitShape(shape As HitShape)
